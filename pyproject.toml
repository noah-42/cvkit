[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvkit"
version = "0.1.0"
description = "A minimal CV site and an ATS version from one data file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
cvkit = "cvkit.cli:main"

[tool.setuptools.packages.find]
include = ["cvkit*"]
